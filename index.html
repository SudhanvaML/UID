        <script>
          var moon = document.getElementById("moon");
          moon.onclick = function () {
            document.body.classList.toggle("darkmode");
            if (document.body.classList.contains("darkmode")) {
              moon.src = "moon.png";
              moon.style.background = "#fff";
            }
            else {
